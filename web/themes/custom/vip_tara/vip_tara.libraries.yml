# These will be loaded on every pages.
# dark-mode.js is loaded very early to limit flash of unstyled content.
global-styling:
  version: VERSION
  css:
    theme:
      css/branding-block.css: {}
      css/text-resize-override.css: {}
      css/style.css: {}
      css/dark-mode.css: {} 
  js:
    js/dark-mode-toggle.js: {}
